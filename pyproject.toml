[project]
name = "day17-gitmind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tanay330", email = "tanaytijare4@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "fastembed>=0.9.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gitmind"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
